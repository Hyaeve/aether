services:
  aether:
    image: ghcr.io/hyaeve/aether:latest
    container_name: Aether
    network_mode: host
    volumes:
      - ./config:/config
      - ./data:/data
      # FUSE 读缓存单独映射，建议放到更快的磁盘
      - ./fuse_read_cache:/fuse_read_cache
      # 需要向宿主机/Emby提供FUSE时，映射父目录并配置传播，见docs/mount-recovery.md
      # - /NetDisk:/NetDisk:rshared
    environment:
      - TZ=Asia/Shanghai
      - AETHER_PORT=15151
    devices:
      - /dev/fuse:/dev/fuse
    pid: "host"
    privileged: true
    restart: unless-stopped
